name: Feature request
description: Suggest an improvement to the food-delivery app.
title: "[Feature]: "
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Backend API
        - Customer frontend
        - Admin frontend
        - Payments and orders
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: User or business need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Data and security considerations
      description: Note effects on authentication, customer information, payments, or permissions.
    validations:
      required: false
