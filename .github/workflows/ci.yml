name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Backend checks and frontend builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install customer frontend dependencies
        run: npm ci --prefix frontend
      - name: Install admin frontend dependencies
        run: npm ci --prefix admin
      - name: Check backend JavaScript syntax
        run: |
          find backend -type f -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -r -n1 node --check
      - name: Build customer frontend
        run: npm run build --prefix frontend
      - name: Build admin frontend
        run: npm run build --prefix admin
